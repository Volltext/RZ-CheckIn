# Der Linux-Kernel bringt eigene NFC-Treiber mit (pn533_usb für den ACR122U und
# verwandte Leser). Werden sie geladen, belegen sie das USB-Gerät exklusiv -- nfcpy
# bekommt es dann nicht mehr auf und der Agent meldet dauerhaft "Reader nicht
# erreichbar" bzw. "Resource busy".
#
# Diese Datei nach /etc/modprobe.d/ kopieren (macht auch linux/install.sh) und die
# Module einmalig entladen:
#   sudo modprobe -r pn533_usb pn533 nfc
#
# Achtung: Das gilt für einen Rechner, der den Leser AUSSCHLIESSLICH für den
# RZ-CheckIn-Agenten nutzt (der typische Kiosk-PC). Wird auf demselben Gerät noch
# anderes NFC-Zubehör über den Kernel-Stack betrieben, diese Datei nicht installieren.
blacklist pn533_usb
blacklist pn533
blacklist nfc
