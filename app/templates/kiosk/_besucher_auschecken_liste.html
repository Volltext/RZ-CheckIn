{% if present %}
<ul class="besucher-treffer">
  {% for p in present %}
  <li>
    <form method="post" action="/kiosk/besucher/auschecken/{{ p.person_id }}" class="formular-inline">
      <span>{{ p.name }}{% if p.firma %} — {{ p.firma }}{% endif %} (seit {{ p.checkin_zeit.strftime("%H:%M") }})</span>
      <button type="submit" class="button button-warnung">Auschecken</button>
    </form>
  </li>
  {% endfor %}
</ul>
{% else %}
<p>Aktuell ist kein externer Besucher eingecheckt.</p>
{% endif %}
