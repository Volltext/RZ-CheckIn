[project]
name = "rz-checkin"
version = "0.1.0"
description = "Eigenständiges Check-in/Check-out-Protokollsystem für das Rechenzentrum"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "passlib[argon2]>=1.7.4",
    "itsdangerous>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
agent = [
    "nfcpy>=1.0.4",
    "pyserial>=3.5",
    "requests>=2.32",
]
# Nur für die Systray-/GUI-Variante des Agenten bzw. den .exe-Build daraus, siehe
# agent/README.md Abschnitt 5. tkinter (Einstellungen-Fenster) ist Teil der
# Standard-Windows-Python-Installation und taucht hier bewusst nicht auf.
agent-tray = [
    "nfcpy>=1.0.4",
    "pyserial>=3.5",
    "requests>=2.32",
    "pystray>=0.19",
    "pillow>=10.0",
    "pyinstaller>=6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
