[project]
name = "rz-checkin"
version = "0.1.0"
description = "Eigenständiges Check-in/Check-out-Protokollsystem für das Rechenzentrum"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "passlib[argon2]>=1.7.4",
    "itsdangerous>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
agent = [
    "nfcpy>=1.0.4",
    "pyserial>=3.5",
    "requests>=2.32",
]
# Nur für die GUI-Variante des Agenten (Systray/Fenster) bzw. die daraus gebaute
# Programmdatei, siehe agent/README.md Abschnitt 5 (Windows) und 9 (Linux). tkinter
# (Einstellungen-Fenster) ist kein PyPI-Paket und taucht hier bewusst nicht auf: unter
# Windows gehört es zur Standard-Python-Installation, unter Linux kommt es aus dem
# Distributionspaket python3-tk bzw. python3-tkinter.
agent-tray = [
    "nfcpy>=1.0.4",
    "pyserial>=3.5",
    "requests>=2.32",
    "pystray>=0.19",
    "pillow>=10.0",
    "pyinstaller>=6.0",
    # Systray-Backend unter Linux, siehe agent/requirements-tray.txt.
    "python-xlib>=0.33; sys_platform == 'linux'",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
