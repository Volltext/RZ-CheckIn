# Baut bei jedem Tag "v*" alles fertig:
#  - Container-Image -> ghcr.io (plus als .tar.gz am Release, für Server ohne Internet)
#  - Windows-Agent   -> RZ-CheckIn-Agent.exe am Release
#  - Linux-Agent     -> rz-checkin-agent-linux-amd64.tar.gz am Release (Binary + install.sh)
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # Release anlegen / Dateien anhängen
  packages: write   # Image nach ghcr.io pushen

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/rz-checkin

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      # Multi-Arch (PC/Server und Raspberry Pi), direkt in die Registry.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Zusätzlich ein ladbares Image für Server ohne Internet (podman load -i ...).
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          tags: rz-checkin:latest
          outputs: type=docker,dest=rz-checkin-amd64.tar
          cache-from: type=gha

      - run: gzip -9 rz-checkin-amd64.tar

      - uses: actions/upload-artifact@v4
        with:
          name: image-tar
          path: rz-checkin-amd64.tar.gz

  agent-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Agent bauen
        shell: pwsh
        run: agent/build_exe.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: agent-windows
          path: agent/dist/RZ-CheckIn-Agent.exe

  agent-linux:
    # Bewusst die älteste verfügbare Ubuntu-Version: PyInstaller bündelt glibc nicht,
    # eine hier gebaute Datei läuft daher auch auf neueren Distributionen.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y python3-tk libusb-1.0-0
      - name: Agent bauen
        run: agent/build_linux.sh
      - name: Paket schnüren (Binary + Installationsskript)
        run: |
          d=rz-checkin-agent-linux
          mkdir -p $d/dist
          cp agent/dist/rz-checkin-agent $d/dist/
          cp -r agent/linux $d/linux
          cp agent/agent.ini.example agent/README.md $d/
          tar czf rz-checkin-agent-linux-amd64.tar.gz $d
      - uses: actions/upload-artifact@v4
        with:
          name: agent-linux
          path: rz-checkin-agent-linux-amd64.tar.gz

  release:
    needs: [image, agent-windows, agent-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
