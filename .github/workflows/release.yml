# Baut bei jedem GitHub-Release (bzw. Tag "v*") das Container-Image fertig,
# veröffentlicht es in der GitHub Container Registry (ghcr.io) und hängt es zusätzlich
# als Datei (.tar.gz, für Server ohne Internet) an das Release an.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # Release anlegen / Dateien anhängen
  packages: write   # Image nach ghcr.io pushen

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/rz-checkin

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      # Multi-Arch (PC/Server und Raspberry Pi), direkt in die Registry.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Zusätzlich ein ladbares Image für Server ohne Internet (podman load -i ...).
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          tags: rz-checkin:latest
          outputs: type=docker,dest=rz-checkin-amd64.tar
          cache-from: type=gha

      - run: gzip -9 rz-checkin-amd64.tar

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: rz-checkin-amd64.tar.gz
