# Beispiel-Reverse-Proxy für TLS-Terminierung mit eigenem internem Zertifikat.
# Optional -- für ein rein internes Tool reicht ggf. auch HTTP im internen VLAN, das
# richtet sich nach eurer internen Policy (siehe Konzept Abschnitt 8.1/8.3).
#
# Nach /etc/nginx/sites-available/rz-checkin.conf kopieren, verlinken und anpassen
# (Zertifikatspfade, server_name).

server {
    listen 443 ssl http2;
    server_name rz-checkin.intern.example.org;

    ssl_certificate     /etc/ssl/rz-checkin/fullchain.pem;
    ssl_certificate_key /etc/ssl/rz-checkin/privkey.pem;

    # Interner Dienst -- keine öffentliche Indexierung/Referrer-Leakage nötig.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name rz-checkin.intern.example.org;
    return 301 https://$host$request_uri;
}
